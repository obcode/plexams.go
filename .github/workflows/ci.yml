name: ci
on:
  push:
    branches:
      - "**"

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=10m
  test:
    name: test
    runs-on: ubuntu-latest
    # A real MongoDB so the integration tests actually run. Without it they fall back
    # to testcontainers and, if Docker is unhappy, silently skip — "green" and "never
    # ran" then look the same. PLEXAMS_TEST_MONGO_REQUIRED turns a skip into a failure.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The same reasoning for PostgreSQL. internal/pgtest creates one database per
      # test from a template, so the user needs CREATEDB — the superuser the image
      # sets up has it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plexams
          POSTGRES_PASSWORD: plexams
          POSTGRES_DB: plexams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test -v ./...
        env:
          PLEXAMS_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          PLEXAMS_TEST_MONGO_REQUIRED: "1"
          PLEXAMS_TEST_PG_URI: postgres://plexams:plexams@127.0.0.1:5432/plexams?sslmode=disable
          PLEXAMS_TEST_PG_REQUIRED: "1"

  sqlc:
    name: sqlc
    runs-on: ubuntu-latest
    # The generated query code is committed, so it can drift from the .sql files
    # without anything noticing. `sqlc diff` fails when regenerating would change
    # something — the same guarantee `go generate` + a dirty check gives for gqlgen.
    #
    # `sqlc vet` is deliberately NOT run here yet: with no rules configured it
    # passes unconditionally, and a green check that checks nothing is worse than
    # no check. It earns its place once db/queries holds real query volume — add a
    # `database.uri` plus the sqlc/db-prepare rule, which prepares every query
    # against a live schema and so catches a query still naming a dropped column.
    # That needs the migrations applied first, so it belongs next to the test job.
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        run: sqlc diff
  release:
    runs-on: ubuntu-latest
    needs:
      - golangci
      - test
      - sqlc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          # changelog-file: "CHANGELOG.md"
          changelog-generator-opt: "emojis=true"
          # hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
