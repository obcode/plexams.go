name: ci
on:
  push:
    branches:
      - "**"

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=10m
  test:
    name: test
    runs-on: ubuntu-latest
    # A real MongoDB so the integration tests actually run. Without it they fall back
    # to testcontainers and, if Docker is unhappy, silently skip — "green" and "never
    # ran" then look the same. PLEXAMS_TEST_MONGO_REQUIRED turns a skip into a failure.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test -v ./...
        env:
          PLEXAMS_TEST_MONGO_URI: mongodb://127.0.0.1:27017
          PLEXAMS_TEST_MONGO_REQUIRED: "1"
  release:
    runs-on: ubuntu-latest
    needs:
      - golangci
      - test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          # changelog-file: "CHANGELOG.md"
          changelog-generator-opt: "emojis=true"
          # hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
