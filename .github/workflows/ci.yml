name: ci
on:
  push:
    branches:
      - "**"

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Gepinnt, nicht `latest`. Am 2026-08-23 ist diese Pipeline ohne eine einzige
          # Codeänderung rot geworden: golangci-lint war auf v2.13.1 weitergezogen und meldete
          # SA1019 auf einer Zeile, die seit Wochen unverändert dort stand. Ein Linter, der
          # sich selbst aktualisiert, ist eine Verhaltensänderung ohne Commit — und die trifft
          # immer den, der gerade etwas anderes vorhatte.
          #
          # Das Hochziehen ist damit eine bewusste Handlung. Dependabot kann diese Zeile nicht
          # bumpen (es kennt Actions und Images, keine Versionsstrings in Eingaben), also
          # gehört sie zu dem, was man beim Aufräumen ansieht.
          version: v2.13.1
          args: --timeout=10m
  test:
    name: test
    runs-on: ubuntu-latest
    # A real PostgreSQL so the integration tests actually run rather than skip:
    # without PLEXAMS_TEST_PG_URI they skip themselves, and "green" and "never ran"
    # then look the same. PLEXAMS_TEST_PG_REQUIRED turns a skip into a failure.
    #
    # internal/pgtest creates one database per test from a template, so the user
    # needs CREATEDB — the superuser the image sets up has it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plexams
          POSTGRES_PASSWORD: plexams
          POSTGRES_DB: plexams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test -v ./...
        env:
          PLEXAMS_TEST_PG_URI: postgres://plexams:plexams@127.0.0.1:5432/plexams?sslmode=disable
          PLEXAMS_TEST_PG_REQUIRED: "1"

  sqlc:
    name: sqlc
    runs-on: ubuntu-latest
    # The generated query code is committed, so it can drift from the .sql files
    # without anything noticing. `sqlc diff` fails when regenerating would change
    # something — the same guarantee `go generate` + a dirty check gives for gqlgen.
    #
    # `sqlc vet` is deliberately NOT run here yet: with no rules configured it
    # passes unconditionally, and a green check that checks nothing is worse than
    # no check. It earns its place once db/queries holds real query volume — add a
    # `database.uri` plus the sqlc/db-prepare rule, which prepares every query
    # against a live schema and so catches a query still naming a dropped column.
    # That needs the migrations applied first, so it belongs next to the test job.
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        run: sqlc diff
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    # Was missing here while tallox.go -- the sibling backend, same author, same stack --
    # has had it all along. Added 2026-09-14 after that job caught two DoS advisories in
    # golang.org/x/crypto that had been sitting in the dependency graph for a week. This
    # module was clean when the job went in; the point is noticing the next one.
    #
    # Deliberately NOT in the release job's `needs`, matching tallox.go. The trade-off is
    # real and went the other way on purpose: gating would have stopped every deploy for
    # that week over an advisory reachable only through a test helper. The cost is that a
    # red vulncheck does not stop anything, so it has to be looked at -- which is exactly
    # how tallox.go stayed red for a week while release kept publishing images.
    #
    # `@latest` for the scanner, unlike golangci-lint above: a vulnerability database is
    # worthless pinned, and govulncheck reports findings rather than opinions, so it cannot
    # go red on a rule that changed its mind.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # govulncheck has no suppression mechanism, so the JSON output is filtered instead:
      # fail on every advisory reachable at symbol level (trace[0].function set -- the
      # same set the text mode reports) unless it is listed in IGNORED. -format json
      # always exits 0; the grep below is what fails the job.
      #
      # IGNORED -- each entry needs a reason and a condition for removal:
      #   GO-2026-6452 (excelize, negative shared-string index): fixed upstream in
      #     f98df08 (GHSA-wcg2-648h-mhxq), which go.mod pins as a pseudo-version, but the
      #     Go vulndb entry has no fixed version and so matches every release. Remove once
      #     excelize tags a release with the fix and go.mod is back on a tag.
      - name: govulncheck
        env:
          IGNORED: GO-2026-6452
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > vuln.json
          jq -r 'select(.finding) | select(.finding.trace[0].function != null) | .finding.osv' vuln.json \
            | sort -u > called.txt
          echo "reachable: $(tr '\n' ' ' < called.txt)"
          grep -vxF -f <(tr ' ' '\n' <<< "$IGNORED") called.txt > failing.txt || true
          if [ -s failing.txt ]; then
            echo "::error::reachable vulnerabilities: $(tr '\n' ' ' < failing.txt)"
            go run golang.org/x/vuln/cmd/govulncheck@latest ./... || true
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs:
      - golangci
      - test
      - sqlc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          # changelog-file: "CHANGELOG.md"
          changelog-generator-opt: "emojis=true"
          # hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
