# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Create and publish a Docker image

on:
    release:
        types: [published]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Get version from tag
              id: version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ steps.version.outputs.VERSION }}
                      GIT_COMMIT=${{ steps.version.outputs.GIT_COMMIT }}
                      BUILD_TIME=${{ steps.version.outputs.BUILD_TIME }}

    # Hand the freshly pushed image over to the deploy workflow.
    #
    # The deploy artefacts (compose file, Caddyfile, deploy.sh, the on-host paths and the
    # host's name) live in the PRIVATE repository obcode/plexams.dev — this one is public.
    # They used to live here, together with a self-hosted runner per public repo; the
    # dispatch replaces both with one runner registered to the private repo.
    #
    # This job runs on ubuntu-latest: it is an OUTBOUND call to api.github.com, which needs
    # no access to the VPN-internal host.
    dispatch-deploy:
        needs: build-and-push-image
        # Gate, like AUTO_DEPLOY in plexams.dev: without DISPATCH_TOKEN `gh api` aborts on
        # an empty GH_TOKEN and turns the release run red. Arm the two together.
        if: ${{ vars.DEPLOY_DISPATCH_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy in plexams.dev auslösen
              env:
                  # A fine-grained PAT with nothing but "contents: write" on
                  # obcode/plexams.dev — the permission repository_dispatch requires. It
                  # cannot read this repository and it is never exposed to a fork: secrets
                  # are not passed to workflows from forked pull requests.
                  GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
              run: |
                  set -euo pipefail
                  # Keep the leading "v": docker/metadata-action tags the image with the raw
                  # git ref (v3.21.1), matching the whole registry's v-prefixed history — so
                  # PLEXAMS_TAG must carry the v too, else the pull 404s. (Only the build job
                  # above strips it, for the bare ldflags version.)
                  gh api repos/obcode/plexams.dev/dispatches \
                    -f event_type=deploy-backend \
                    -F "client_payload[tag]=${GITHUB_REF#refs/tags/}"
